[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odie"
version = "0.1.0"
description = "On-Demand INR Experts for image fitting"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow", "torch", "ninja", "scikit-image", "PyYAML", "msgpack", "tqdm"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["odie*", "scripts*"]

[tool.setuptools.package-data]
odie = ["*.cpp", "*.cu", "native/*.cu", "native/*.cuh", "native/CMakeLists.txt"]
